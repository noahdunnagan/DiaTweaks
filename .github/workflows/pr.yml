name: PR

# pull_request_target runs on fork PRs without a maintainer approving the run,
# so contributors see the problems straight away. It runs main's copy of this
# workflow and script and never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/check-pr.js')({ github, context, core })
